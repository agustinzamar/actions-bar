name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint and SwiftFormat
        run: brew install swiftlint swiftformat
      - name: SwiftFormat --lint
        run: swiftformat --lint .
      - name: SwiftLint
        run: swiftlint lint
